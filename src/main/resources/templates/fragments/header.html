<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header" class="topbar">
    <div class="brand">
        <a th:href="@{/}">IOTSTAR SHOP</a>
    </div>

    <nav>
        <a th:href="@{/}">Home</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/dashboard}">Dashboard</a>
    </nav>

    <div class="account" sec:authorize="isAuthenticated()">
        <span sec:authentication="name">user</span>
        <span class="badge" sec:authorize="hasRole('ADMIN')">ADMIN</span>
        <span class="badge" sec:authorize="hasRole('USER')">USER</span>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <button class="link-button" type="submit">Đăng xuất</button>
        </form>
    </div>

    <div class="account" sec:authorize="!isAuthenticated()">
        <a class="link-button" th:href="@{/login}">Đăng nhập</a>
    </div>
</header>
</body>
</html>
