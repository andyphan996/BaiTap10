<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header" class="header">
    <a th:href="@{/}" class="brand">IOTSTAR SHOP</a>

    <nav>
        <a th:href="@{/}">Dashboard</a>
        <a th:href="@{/products}">Products</a>
        <a th:if="${#authorization.expression('hasRole(''ADMIN'')')}" th:href="@{/users}">Users</a>
    </nav>

    <div class="account" th:if="${#authorization.expression('isAuthenticated()')}">
        <img class="avatar"
             th:src="@{${#authentication.principal.images != null
                        and !#strings.isEmpty(#authentication.principal.images)
                        ? #authentication.principal.images
                        : '/images/avatar-default.png'}}"
             alt="Avatar" width="40" height="40">
        <div class="who">
            <strong th:text="${#authentication.principal.fullName}">Nguyễn Văn A</strong>
            <span class="muted" th:text="${#authentication.principal.username + ' · ' + #authentication.principal.email}">user · email</span>
        </div>
        <span class="badge" th:text="${#authentication.principal.role == 'ROLE_ADMIN' ? 'ADMIN' : 'USER'}">USER</span>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <button type="submit" class="link-button">Đăng xuất</button>
        </form>
    </div>

    <div class="account" th:unless="${#authorization.expression('isAuthenticated()')}">
        <a th:href="@{/login}">Đăng nhập</a>
        <a th:href="@{/register}">Đăng ký</a>
    </div>
</header>
</body>
</html>
