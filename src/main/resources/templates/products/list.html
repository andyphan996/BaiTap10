<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Products</title>
</head>
<body>
<main layout:fragment="content">
    <h1>Quản lý Products <small class="muted-dark" th:text="'(' + ${products.totalElements} + ' sản phẩm)'"></small></h1>

    <div class="toolbar">
        <form th:action="@{/products}" method="get">
            <input name="keyword" th:value="${keyword}" placeholder="Tên sản phẩm, mô tả...">
            <input type="hidden" name="size" th:value="${size}">
            <button class="button" type="submit">Tìm kiếm</button>
        </form>
        <a class="button" th:href="@{/products/create}">+ Thêm Product</a>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Ảnh</th>
            <th>Tên</th>
            <th>Giá</th>
            <th>User</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${products.content}">
            <td th:text="${p.id}"></td>
            <td>
                <img th:if="${p.imageUrl != null}" th:src="${#strings.substringBefore(p.imageUrl, '|')}"
                     class="thumb" alt="Ảnh sản phẩm">
                <span th:unless="${p.imageUrl != null}" class="muted-dark">No image</span>
            </td>
            <td th:text="${p.name}"></td>
            <td th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 2, 'POINT')}"></td>
            <td th:text="${p.username}"></td>
            <td class="actions">
                <th:block th:if="${#authorization.expression('hasRole(''ADMIN'')') or p.userId == #authentication.principal.id}">
                    <a th:href="@{/products/edit/{id}(id=${p.id})}">Edit</a>
                    <form th:action="@{/products/delete/{id}(id=${p.id})}" method="post"
                          onsubmit="return confirm('Xóa product này?')">
                        <button class="danger-link" type="submit">Delete</button>
                    </form>
                </th:block>
            </td>
        </tr>
        <tr th:if="${products.empty}">
            <td colspan="6">Không có dữ liệu.</td>
        </tr>
        </tbody>
    </table>

    <div class="pagination" th:if="${products.totalPages > 1}">
        <a th:if="${products.hasPrevious()}"
           th:href="@{/products(page=${products.number - 1},size=${size},keyword=${keyword})}">«</a>
        <a th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}"
           th:classappend="${i == products.number ? 'active' : ''}"
           th:href="@{/products(page=${i},size=${size},keyword=${keyword})}"
           th:text="${i + 1}"></a>
        <a th:if="${products.hasNext()}"
           th:href="@{/products(page=${products.number + 1},size=${size},keyword=${keyword})}">»</a>
    </div>
</main>
</body>
</html>
