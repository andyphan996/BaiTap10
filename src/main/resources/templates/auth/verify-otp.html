<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/auth}">
<head>
    <title>Xác nhận OTP</title>
</head>
<body>
<div layout:fragment="content">
    <h1>Xác nhận OTP</h1>
    <form th:action="@{/verify-otp}" th:object="${verifyOtpDTO}" method="post">
        <div th:if="${#fields.hasGlobalErrors()}" class="alert error">
            <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
        </div>

        <label>Email</label>
        <input type="email" th:field="*{email}" required>
        <small class="error-text" th:errors="*{email}"></small>

        <label>OTP 6 số</label>
        <input th:field="*{otp}" maxlength="6" inputmode="numeric" required>
        <small class="error-text" th:errors="*{otp}"></small>

        <button class="button full" type="submit">Xác nhận</button>
    </form>

    <form th:action="@{/resend-register-otp}" method="post" class="mt">
        <input type="hidden" name="email" th:value="${verifyOtpDTO.email}">
        <button class="button secondary full" type="submit">Gửi lại OTP</button>
    </form>
    <p class="auth-links"><a th:href="@{/login}">Quay lại đăng nhập</a></p>
</div>
</body>
</html>
