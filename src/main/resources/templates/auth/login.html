<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/auth}">
<head>
    <title>Đăng nhập</title>
</head>
<body>
<div layout:fragment="content">
    <h1>Đăng nhập</h1>
    <div th:if="${param.error}" class="alert error">
        Username/email hoặc mật khẩu không đúng, hoặc tài khoản chưa được xác thực OTP.
    </div>
    <div th:if="${param.logout}" class="alert success">Bạn đã đăng xuất.</div>
    <div th:if="${param.expired}" class="alert error">Phiên đăng nhập đã hết hạn do tài khoản đăng nhập ở nơi khác.</div>

    <form th:action="@{/login}" method="post">
        <label>Username hoặc Email</label>
        <input name="username" placeholder="Username hoặc email" required autofocus>
        <label>Mật khẩu</label>
        <input type="password" name="password" placeholder="Mật khẩu" required>
        <button class="button full" type="submit">Đăng nhập</button>
    </form>
    <p class="auth-links">
        <a th:href="@{/register}">Tạo tài khoản</a>
        <a th:href="@{/forgot-password}">Quên mật khẩu?</a>
    </p>
</div>
</body>
</html>
