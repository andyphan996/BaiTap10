<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/auth}">
<head>
    <title>Quên mật khẩu</title>
</head>
<body>
<div layout:fragment="content">
    <h1>Quên mật khẩu</h1>
    <form th:action="@{/forgot-password}" th:object="${forgotPasswordDTO}" method="post">
        <div th:if="${#fields.hasGlobalErrors()}" class="alert error">
            <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
        </div>
        <label>Email</label>
        <input type="email" th:field="*{email}" required>
        <small class="error-text" th:errors="*{email}"></small>
        <button class="button full" type="submit">Gửi OTP</button>
    </form>
    <p class="auth-links"><a th:href="@{/login}">Quay lại đăng nhập</a></p>
</div>
</body>
</html>
