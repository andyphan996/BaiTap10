<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/auth}">
<head>
    <title>Đặt lại mật khẩu</title>
</head>
<body>
<div layout:fragment="content">
    <h1>Đặt lại mật khẩu</h1>
    <form th:action="@{/reset-password}" th:object="${resetPasswordDTO}" method="post">
        <div th:if="${#fields.hasGlobalErrors()}" class="alert error">
            <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
        </div>

        <label>Email</label>
        <input type="email" th:field="*{email}" required>
        <small class="error-text" th:errors="*{email}"></small>

        <label>OTP</label>
        <input name="otp" maxlength="6" inputmode="numeric" required>

        <label>Mật khẩu mới</label>
        <input type="password" th:field="*{password}" required>
        <small class="error-text" th:errors="*{password}"></small>

        <label>Xác nhận mật khẩu</label>
        <input type="password" th:field="*{confirmPassword}" required>
        <small class="error-text" th:errors="*{confirmPassword}"></small>

        <button class="button full" type="submit">Đổi mật khẩu</button>
    </form>
    <p class="auth-links"><a th:href="@{/login}">Quay lại đăng nhập</a></p>
</div>
</body>
</html>
