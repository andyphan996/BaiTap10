<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layouts/layout :: head('Trang chủ')}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="container">
    <h1>Home</h1>
    <div class="panel">
        <p sec:authorize="isAuthenticated()">
            Xin chào <strong sec:authentication="name">user</strong>, bạn đã đăng nhập thành công.
        </p>
        <p sec:authorize="!isAuthenticated()">
            Bạn chưa đăng nhập. <a th:href="@{/login}">Đăng nhập ngay</a>
        </p>
    </div>
</main>
</body>
</html>
