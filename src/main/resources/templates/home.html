<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Trang chủ</title>
</head>
<body>
<main layout:fragment="content">
    <h1>Trang chủ UTEShop</h1>
    <div class="panel">
        <p>
            Xin chào
            <strong th:text="${#authentication.principal.fullName}">User</strong>
        </p>
        <p>Username: <b th:text="${#authentication.principal.username}">user01</b></p>
        <p>Email: <b th:text="${#authentication.principal.email}">user01@gmail.com</b></p>
    </div>
</main>
</body>
</html>
